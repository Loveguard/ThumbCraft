<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Bungee; src: url('../../node_modules/@fontsource/bungee/files/bungee-latin-400-normal.woff2'); }
@font-face { font-family: Lilita; src: url('../../node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 400px; overflow: hidden; background: #0b1210; }
.stage { position: relative; width: 1280px; height: 400px; overflow: hidden; font-family: Lilita, sans-serif; }
.bg { position: absolute; inset: -30px; background: url('../../docs/images/preview-100days.jpg') center 40% / cover; filter: blur(10px) saturate(1.2) brightness(0.42); }
.tint { position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 90% at 22% 50%, rgba(4, 22, 13, 0.92), rgba(6, 20, 14, 0.3) 70%, transparent),
    linear-gradient(90deg, rgba(5, 14, 10, 0.8) 0%, rgba(5, 14, 10, 0.25) 55%, rgba(5, 14, 10, 0.6) 100%); }
.grid { position: absolute; inset: 0; opacity: 0.12;
  background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
  background-size: 32px 32px; mask-image: linear-gradient(90deg, black, transparent 60%); }
.brand { position: absolute; left: 56px; top: 44px; width: 640px; }
.kicker { display: flex; align-items: center; gap: 12px; font-size: 19px; color: #d1fae5; }
.logo { width: 40px; height: 40px; border-radius: 11px; box-shadow: 0 6px 16px rgba(0,0,0,.55), 0 0 0 2px rgba(134,239,172,.35); }
.new { font-family: Bungee, sans-serif; font-size: 17px; color: #1a1300; background: linear-gradient(180deg, #fde68a, #f59e0b); padding: 6px 12px 4px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 -3px 0 rgba(0,0,0,.2); transform: rotate(-3deg); }
.title { margin-top: 20px; font-family: Bungee, sans-serif; font-size: 60px; line-height: 1.02; letter-spacing: 1px; position: relative; color: transparent; }
.title span { display: block; white-space: nowrap; }
.title .fill, .title .depth { position: absolute; left: 0; top: 0; }
.title .depth { color: #0f3d24;
  text-shadow: 1px 1px 0 #0f3d24, 2px 2px 0 #0f3d24, 3px 3px 0 #0d3520, 4px 4px 0 #0d3520, 5px 5px 0 #0b2e1c, 6px 6px 0 #0b2e1c, 7px 7px 0 #092717, 8px 8px 0 #092717, 10px 14px 18px rgba(0,0,0,.6);
  -webkit-text-stroke: 6px #06180f; }
.title .fill { background: linear-gradient(180deg, #d9ffe6 0%, #86efac 38%, #22c55e 62%, #15803d 100%); -webkit-background-clip: text; background-clip: text; }
.title .ghost { visibility: hidden; }
.tag { margin-top: 22px; font-size: 26px; white-space: nowrap; color: #ecfdf5; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.tag b { color: #86efac; font-weight: 400; }
.chips { margin-top: 18px; display: flex; gap: 7px; }
.chip { font-size: 14px; white-space: nowrap; color: #d1fae5; padding: 6px 12px; border-radius: 999px; background: rgba(16, 40, 28, 0.72); border: 1px solid rgba(134, 239, 172, 0.35); }
/* The right side: one frame of the scene playing, over its timeline. */
.player { position: absolute; left: 730px; top: 22px; width: 500px; transform: rotate(-1.5deg); }
.frame { position: relative; height: 190px; border-radius: 12px; overflow: hidden; background: #000 url('../../docs/images/preview-100days.jpg') center 30% / cover;
  box-shadow: 0 30px 60px rgba(0,0,0,.8), 0 0 0 4px #fff, 0 0 40px rgba(134,239,172,.35); }
.play { position: absolute; left: 12px; bottom: 10px; width: 46px; height: 46px; border-radius: 50%; background: rgba(6, 24, 15, 0.78); border: 3px solid #86efac; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
.play::after { content: ''; position: absolute; left: 16px; top: 10px; border: 10px solid transparent; border-left: 16px solid #d9ffe6; border-right: 0; }
.time { position: absolute; right: 8px; bottom: 8px; font-size: 15px; color: #fff; background: rgba(0,0,0,.82); padding: 1px 6px; border-radius: 4px; }
.timeline { position: relative; margin-top: 14px; padding: 9px 12px 10px; border-radius: 12px; background: rgba(10, 24, 17, 0.92); border: 1px solid rgba(134, 239, 172, 0.35); box-shadow: 0 18px 36px rgba(0,0,0,.6); }
.ruler { height: 10px; margin-left: 74px; background-image: linear-gradient(90deg, rgba(209,250,229,.45) 1px, transparent 1px); background-size: 20px 100%; opacity: .7; }
.lane { display: flex; align-items: center; height: 20px; margin-top: 5px; }
.lane i { width: 74px; font-style: normal; font-size: 13px; color: #a7f3d0; }
.track { position: relative; flex: 1; height: 100%; border-radius: 6px; background: rgba(255,255,255,.05); }
.clip { position: absolute; top: 0; height: 100%; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #06180f; white-space: nowrap; overflow: hidden; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.walk { background: #86efac; } .hit { background: #fca5a5; } .cam { background: #fde68a; } .sky { background: #93c5fd; } .snd { background: #c4b5fd; }
.head { position: absolute; left: 248px; top: 6px; bottom: 8px; width: 2px; background: #fff; box-shadow: 0 0 8px #86efac; }
.head::before { content: ''; position: absolute; left: -6px; top: -2px; border: 7px solid transparent; border-top: 9px solid #fff; }
</style></head>
<body><div class="stage">
  <div class="bg"></div><div class="tint"></div><div class="grid"></div>
  <div class="brand">
    <div class="kicker"><img class="logo" src="../../build/icon.png"><span>ThumbCraft 0.7</span><span class="new">NEW</span></div>
    <div class="title">
      <div class="ghost"><span>THE ANIMATION</span><span>UPDATE</span></div>
      <div class="depth"><span>THE ANIMATION</span><span>UPDATE</span></div>
      <div class="fill"><span>THE ANIMATION</span><span>UPDATE</span></div>
    </div>
    <div class="tag">Minecraft animation, <b>without the hard part</b></div>
    <div class="chips">
      <span class="chip">🎬 Ready-made scenes</span><span class="chip">✏️ Draw a walk</span>
      <span class="chip">🔥 Living effects</span><span class="chip">📼 MP4 · GIF</span>
    </div>
  </div>
  <div class="player">
    <div class="frame"><div class="play"></div><div class="time">0:04 / 0:12</div></div>
    <div class="timeline">
      <div class="ruler"></div>
      <div class="lane"><i>Steve</i><div class="track"><div class="clip walk" style="left:0;width:150px">Walk</div><div class="clip hit" style="left:156px;width:84px">Slash</div><div class="clip walk" style="left:246px;width:120px">Cheer</div></div></div>
      <div class="lane"><i>Camera</i><div class="track"><div class="clip cam" style="left:30px;width:190px">Push in</div><div class="clip cam" style="left:226px;width:150px">Orbit</div></div></div>
      <div class="lane"><i>Scene</i><div class="track"><div class="clip sky" style="left:90px;width:210px">Sunset</div></div></div>
      <div class="lane"><i>Sound</i><div class="track"><div class="clip snd" style="left:0;width:390px">music.mp3</div></div></div>
      <div class="head"></div>
    </div>
  </div>
</div></body></html>
