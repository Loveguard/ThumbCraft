<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Bungee; src: url('../../node_modules/@fontsource/bungee/files/bungee-latin-400-normal.woff2'); }
@font-face { font-family: Lilita; src: url('../../node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 400px; overflow: hidden; background: #0b1210; }
.stage { position: relative; width: 1280px; height: 400px; overflow: hidden; font-family: Lilita, sans-serif; }
.bg { position: absolute; inset: -30px; background: url('../../docs/images/preview-manhunt.jpg') center 55% / cover; filter: blur(8px) saturate(1.2) brightness(0.5); }
.tint { position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 90% at 22% 50%, rgba(4, 22, 13, 0.9), rgba(6, 20, 14, 0.25) 70%, transparent),
    linear-gradient(90deg, rgba(5, 14, 10, 0.75) 0%, rgba(5, 14, 10, 0.2) 55%, rgba(5, 14, 10, 0.55) 100%); }
/* A faint block grid, like looking at the world through the editor. */
.grid { position: absolute; inset: 0; opacity: 0.12;
  background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
  background-size: 32px 32px; mask-image: linear-gradient(90deg, black, transparent 60%); }
.brand { position: absolute; left: 56px; top: 78px; width: 700px; }
.logo-row { display: flex; align-items: center; gap: 18px; }
.logo { width: 80px; height: 80px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 2px rgba(134,239,172,.35); }
.title { font-family: Bungee, sans-serif; font-size: 62px; line-height: 1; letter-spacing: 1px; position: relative; color: transparent; }
.title .fill, .title .depth { position: absolute; left: 0; top: 0; white-space: nowrap; }
.title .depth { color: #0f3d24;
  text-shadow: 1px 1px 0 #0f3d24, 2px 2px 0 #0f3d24, 3px 3px 0 #0d3520, 4px 4px 0 #0d3520, 5px 5px 0 #0b2e1c, 6px 6px 0 #0b2e1c, 7px 7px 0 #092717, 8px 8px 0 #092717, 10px 14px 18px rgba(0,0,0,.6);
  -webkit-text-stroke: 6px #06180f; }
.title .fill { background: linear-gradient(180deg, #d9ffe6 0%, #86efac 38%, #22c55e 62%, #15803d 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title .ghost { visibility: hidden; white-space: nowrap; }
.tag { margin-top: 24px; font-size: 27px; white-space: nowrap; color: #ecfdf5; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.tag b { color: #86efac; font-weight: 400; }
.chips { margin-top: 20px; display: flex; gap: 7px; flex-wrap: nowrap; }
.chip { font-size: 14px; white-space: nowrap; color: #d1fae5; padding: 6px 12px; border-radius: 999px; background: rgba(16, 40, 28, 0.72); border: 1px solid rgba(134, 239, 172, 0.35); backdrop-filter: blur(4px); }
.free { position: absolute; left: 470px; top: 44px; transform: rotate(7deg); z-index: 5; font-family: Bungee, sans-serif; font-size: 22px; color: #1a1300; background: linear-gradient(180deg, #fde68a, #f59e0b); padding: 8px 16px 6px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 -3px 0 rgba(0,0,0,.2); }
.cards { position: absolute; left: 730px; top: 0; width: 550px; height: 400px; }
/* Three thumbnails made with ThumbCraft: Manhunt up front, the other two fanned out behind it. */
.thumb { position: absolute; border-radius: 12px; overflow: hidden; background: #000 center / cover;
  box-shadow: 0 22px 44px rgba(0,0,0,.7), 0 0 0 3px rgba(255,255,255,.9); }
.thumb::after { content: attr(data-time); position: absolute; right: 8px; bottom: 8px; font: 13px Lilita, sans-serif; color: #fff; background: rgba(0,0,0,.82); padding: 1px 6px; border-radius: 4px; }
.back { width: 280px; height: 158px; filter: brightness(.72) saturate(.95); }
.back-l { left: -6px; top: 34px; transform: rotate(-10deg); background-image: url('../../docs/images/preview-day1.jpg'); z-index: 1; }
.back-r { left: 252px; top: 30px; transform: rotate(9deg); background-image: url('../../docs/images/preview-100days.jpg'); z-index: 1; }
.front { left: 52px; top: 132px; width: 448px; height: 252px; transform: rotate(-1.5deg); z-index: 3;
  background-image: url('../../docs/images/preview-manhunt.jpg');
  box-shadow: 0 30px 60px rgba(0,0,0,.8), 0 0 0 4px #fff, 0 0 40px rgba(134,239,172,.35); }
.front::after { font-size: 15px; }
.cursor { position: absolute; right: 150px; bottom: 60px; width: 34px; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
</style></head>
<body><div class="stage">
  <div class="bg"></div><div class="tint"></div><div class="grid"></div>
  <div class="brand">
    <div class="logo-row">
      <img class="logo" src="../../build/icon.png">
      <div class="title"><span class="ghost">THUMBCRAFT</span><span class="depth">THUMBCRAFT</span><span class="fill">THUMBCRAFT</span></div>
    </div>
    <div class="tag">The <b>free 3D thumbnail studio</b> for Minecraft creators</div>
    <div class="chips">
      <span class="chip">⛰️ Real Minecraft terrain</span><span class="chip">🧍 Any skin, any pose</span>
      <span class="chip">🐉 Every mob &amp; build</span><span class="chip">🎬 Hollywood looks</span>
    </div>
  </div>
  <div class="free">100% FREE</div>
  <div class="cards">
    <div class="thumb back back-l" data-time="14:20"></div>
    <div class="thumb back back-r" data-time="22:51"></div>
    <div class="thumb front" data-time="31:07"></div>
  </div>
  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2 3.6 7.3-2.7 1.3-3.6-7.4L4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div></body></html>
