name: Release

# Push a version tag (e.g. `npm version minor && git push --follow-tags`) to build the Windows installer,
# the portable .exe and the macOS app, and publish them as a GitHub release. It can also be started by hand
# (Actions → Release → Run workflow) with a tag name; the release then creates that tag on the built commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.0'
        required: true

# Building runs every npm package's code, so it gets a read-only token; only the small publish job, which
# runs no npm code at all, may write the release.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to exact commits (tags can be moved); the comment says which release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      # Installed copies update from latest.yml, whose version comes from package.json, not the tag: a tag that
      # doesn't match would publish a release no installed copy ever updates to.
      - shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          [[ "$TAG" == "$want" ]] || { echo "Tag $TAG doesn't match package.json ($want); bump the version first"; exit 1; }
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - run: npm ci
      - run: npm test
      # The mob-model helper ships compiled from its source here, never from a committed binary.
      - run: npm run build:dumper
      - run: npx electron-vite build
      # Windows builds are signed with Azure Trusted Signing once its secrets and variables are set (see
      # docs/SIGNING.md); until then they're unsigned, so SmartScreen warns on first run. macOS ones are ad-hoc.
      - shell: bash
        run: |
          sign=()
          if [[ "$RUNNER_OS" == Windows && -n "$AZURE_CLIENT_ID" ]]; then
            sign=(
              "-c.win.azureSignOptions.publisherName=$SIGN_PUBLISHER"
              "-c.win.azureSignOptions.endpoint=$SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$SIGN_PROFILE"
            )
          fi
          npx electron-builder $TARGET --publish never "${sign[@]}"
        env:
          TARGET: ${{ matrix.target }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_PUBLISHER: ${{ vars.SIGN_PUBLISHER }}
          SIGN_ENDPOINT: ${{ vars.SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.SIGN_PROFILE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # latest.yml (Windows) and latest-mac.yml are what installed copies check for updates.
      - run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ThumbCraft $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never pasted into the script, so a typed tag can't inject commands.
          TAG: ${{ inputs.tag || github.ref_name }}
